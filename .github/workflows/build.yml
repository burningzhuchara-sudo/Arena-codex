name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (writable copy)
        shell: bash
        run: |
          set -e
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"

          if [ -d /usr/local/lib/android/sdk/cmdline-tools/latest ]; then
            cp -r /usr/local/lib/android/sdk/cmdline-tools/latest "$SDK/cmdline-tools/latest"
          elif [ -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
            cp -r "$ANDROID_HOME/cmdline-tools/latest" "$SDK/cmdline-tools/latest"
          else
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p /tmp/cmdtools
            unzip -q -o /tmp/cmdtools.zip -d /tmp/cmdtools
            mv /tmp/cmdtools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi

          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          chmod -R u+rwX "$SDK/cmdline-tools"
          chmod +x "$SM"

          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "sdk.dir=$SDK" > local.properties
          "$SM" --sdk_root="$SDK" --list_installed | head -n 25

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Assemble APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaCodex-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
